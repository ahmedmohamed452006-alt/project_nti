<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>جاري التوجيه للوحة التحكم... | BUNYORA</title>
  <script src="assets/js/auth.js"></script>
  <script>
    // Smart Role Router: Directs each user strictly to their own role dashboard
    const user = window.BunyoraAuth.getUser();
    if (!user) {
      window.location.replace("login.html");
    } else {
      window.location.replace(window.BunyoraAuth.getDashboardUrl(user.role));
    }
  </script>
</head>
<body></body>
</html>
