<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" data-language="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | BUNYORA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login">

  <header class="site-header">
    <div class="container-custom header-inner">
      <a href="index.html" class="brand"><img class="brand-logo" src="assets/img/Bunyora Architectural Monogram Logo.webp" alt="BUNYORA"></a>
      <nav class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="engineers.html">المهندسين</a>
        <a href="workers.html">العمال</a>
        <a href="suppliers.html">الأدوات والمحلات</a>
        <a href="request.html">اطلب خدمة</a>
      </nav>
      <div class="header-actions">
        <a class="btn-bunyora btn-bunyora-primary" href="register.html">إنشاء حساب جديد</a>
      </div>
    </div>
  </header>

  <main class="section py-5">
    <div class="container-custom" style="max-width: 560px;">
      <div class="panel-card p-4 p-md-5 shadow-sm">
        <div class="text-center mb-4">
          <img src="assets/img/Bunyora Architectural Monogram Logo.webp" alt="BUNYORA" style="width: 165px; height: 76px; object-fit: contain;" class="mb-2">
          <h1 class="fs-4 fw-bold mb-1">تسجيل الدخول إلى حسابك</h1>
          <p class="text-muted small mb-0">سيتم توجيهك تلقائياً إلى لوحة التحكم الخاصة بنوع حسابك وصلاحياتك</p>
        </div>

        <div id="login-error" class="alert alert-danger small fw-bold py-2" hidden></div>

        <form id="login-form">
          <div class="mb-3">
            <label class="form-label-custom">البريد الإلكتروني</label>
            <input type="email" id="login-email" class="form-control-custom" placeholder="name@bunyora.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label-custom">كلمة المرور</label>
            <input type="password" id="login-password" class="form-control-custom" placeholder="••••••••" value="password123" required>
          </div>
          <button type="submit" id="login-submit-btn" class="btn-bunyora btn-bunyora-primary w-100 py-2 mb-3">
            تسجيل الدخول ←
          </button>
        </form>

        <!-- Quick Role Login Switcher for Testing & Graduation Demo -->
        <div class="mt-4 pt-3 border-top">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="fw-bold text-dark">⚡ دخول سريع حسب الصلاحية (لتجربة لوحات التحكم الـ 5):</small>
            <span class="badge bg-warning text-dark">كلمة السر: password123</span>
          </div>
          <div class="row g-2">
            <div class="col-12">
              <button type="button" class="btn-bunyora btn-bunyora-gold w-100 py-2 small" onclick="quickLogin('admin@bunyora.com')">
                👑 دخول كمدير المنصة (Admin Control Panel)
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn-bunyora btn-bunyora-soft w-100 py-2 small" onclick="quickLogin('omar.shazly@bunyora.com')">
                📐 لوحة المهندس (م. عمر)
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn-bunyora btn-bunyora-outline w-100 py-2 small" onclick="quickLogin('karim.client@bunyora.com')">
                👤 لوحة العميل (أ. كريم)
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn-bunyora btn-bunyora-outline w-100 py-2 small" onclick="quickLogin('mahmoud.elec@bunyora.com')">
                👷 لوحة الصنايعي (محمود)
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn-bunyora btn-bunyora-outline w-100 py-2 small" onclick="quickLogin('safwa.ceramic@bunyora.com')">
                🏪 لوحة المعرض (الصفوة)
              </button>
            </div>
          </div>
        </div>

        <div class="text-center small text-muted mt-4 pt-2 border-top">
          ليس لديك حساب بعد؟ <a href="register.html" class="text-link">إنشاء حساب جديد</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/preferences.js"></script>
  <script>
    const errBox = document.getElementById("login-error");

    const demoUsersFallback = {
      "admin@bunyora.com": { id: 1, full_name: "إدارة منصة BUNYORA", email: "admin@bunyora.com", role: "admin", governorate: "القاهرة", status: "approved" },
      "omar.shazly@bunyora.com": { id: 2, full_name: "م. عمر الشاذلي", email: "omar.shazly@bunyora.com", role: "engineer", governorate: "القاهرة", city: "التجمع الخامس", status: "approved", engineer_profile: { id: 1, specialty_ar: "هندسة معمارية", university: "كلية الهندسة - جامعة عين شمس", is_verified: 1, avg_rating: 4.9 } },
      "karim.client@bunyora.com": { id: 10, full_name: "أ. كريم محمود", email: "karim.client@bunyora.com", role: "customer", governorate: "القاهرة", city: "التجمع الخامس", status: "approved" },
      "mahmoud.elec@bunyora.com": { id: 7, full_name: "الحاج محمود الكهربائي", email: "mahmoud.elec@bunyora.com", role: "worker", governorate: "القاهرة", city: "مدينة نصر", status: "approved" },
      "safwa.ceramic@bunyora.com": { id: 9, full_name: "معرض الصفوة للسيراميك", email: "safwa.ceramic@bunyora.com", role: "supplier", governorate: "القاهرة", city: "مدينة نصر", status: "approved" }
    };

    async function performLogin(email, password) {
      errBox.hidden = true;
      try {
        const res = await fetch("api/index.php?route=auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok || data.status !== "success") {
          errBox.textContent = data.message || "بيانات الدخول غير صحيحة";
          errBox.hidden = false;
          return;
        }
        window.BunyoraAuth.setSession(data.user, data.token);
        window.location.href = window.BunyoraAuth.getDashboardUrl(data.user.role);
      } catch (e) {
        // Fallback for static hosting (GitHub Pages / Netlify)
        const fallbackUser = demoUsersFallback[email.trim().toLowerCase()];
        if (fallbackUser && password === "password123") {
          window.BunyoraAuth.setSession(fallbackUser, "static_demo_token");
          window.location.href = window.BunyoraAuth.getDashboardUrl(fallbackUser.role);
          return;
        }
        errBox.textContent = "تأكد من تشغيل Apache و MySQL في XAMPP أو استخدم أزرار الدخول السريع.";
        errBox.hidden = false;
      }
    }

    window.quickLogin = (email) => {
      document.getElementById("login-email").value = email;
      document.getElementById("login-password").value = "password123";
      performLogin(email, "password123");
    };

    document.getElementById("login-form")?.addEventListener("submit", e => {
      e.preventDefault();
      performLogin(
        document.getElementById("login-email").value,
        document.getElementById("login-password").value
      );
    });
  </script>
</body>
</html>
