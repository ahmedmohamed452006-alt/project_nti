<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" data-language="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المهندسين | BUNYORA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="engineers" id="top">

  <header class="site-header">
    <div class="container-custom header-inner">
      <a href="index.html" class="brand"><img class="brand-logo" src="assets/img/bunyora-logo.webp" alt="BUNYORA"></a>
      <nav class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a class="active" href="engineers.html">المهندسين</a>
        <a href="workers.html">العمال</a>
        <a href="suppliers.html">الأدوات والمحلات</a>
        <a href="request.html">اطلب خدمة</a>
        <a href="dashboard.html">لوحة التحكم</a>
      </nav>
      <div class="header-actions">
        <a class="btn-bunyora btn-bunyora-outline" href="login.html">تسجيل الدخول</a>
        <a class="btn-bunyora btn-bunyora-primary" href="request.html">ابدأ طلبك</a>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <div class="container-custom">
      <div class="small text-white-50 mb-2"><a href="index.html" class="text-white-50">الرئيسية</a> / المهندسين</div>
      <h1>دليل المهندسين المعتمدين</h1>
      <p>ابحث وقارن بين المهندسين حسب التخصص، المحافظة، سنوات الخبرة والتقييمات.</p>
    </div>
  </section>

  <main class="section">
    <div class="container-custom">
      <div class="row g-4 align-items-start">
        <!-- Filter Sidebar -->
        <div class="col-lg-3">
          <aside class="filter-panel">
            <h3>تصفية النتائج</h3>
            <div class="mb-3">
              <label class="form-label-custom">بحث بالاسم أو الكلمة</label>
              <input type="text" id="filter-q" class="form-control-custom" placeholder="مثال: تصميم، إنشائي، عمر...">
            </div>
            <div class="mb-3">
              <label class="form-label-custom">التخصص الهندسي</label>
              <select id="filter-specialty" class="form-control-custom">
                <option value="">كل التخصصات</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label-custom">المحافظة</label>
              <select id="filter-governorate" class="form-control-custom">
                <option value="">كل المحافظات</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label-custom">سنوات الخبرة</label>
              <select id="filter-years" class="form-control-custom">
                <option value="">الكل</option>
                <option value="5">+5 سنوات خبرة</option>
                <option value="10">+10 سنوات خبرة</option>
              </select>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="filter-verified">
              <label class="form-check-label small fw-bold" for="filter-verified">مهندسون موثّقون فقط ✓</label>
            </div>
            <button type="button" id="filter-reset" class="btn-bunyora btn-bunyora-outline w-100">مسح الفلاتر</button>
          </aside>
        </div>

        <!-- Results Area -->
        <div class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
            <strong id="engineers-count" class="fs-5">0 مهندس متاح</strong>
            <div class="d-flex align-items-center gap-2">
              <label class="small text-muted fw-bold">ترتيب حسب:</label>
              <select id="filter-sort" class="form-control-custom" style="width: auto;">
                <option value="relevant">الأكثر صلة</option>
                <option value="rating">الأعلى تقييماً</option>
                <option value="experience">الأكثر خبرة</option>
              </select>
            </div>
          </div>
          <div class="row g-4" id="engineers-grid">
            <!-- Rendered by main.js -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container-custom">
      <div class="footer-bottom mt-0 pt-0 border-0">
        <span>© 2026 BUNYORA — مشروع تخرج NTI</span>
        <a href="index.html">العودة للرئيسية ←</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/preferences.js"></script>
</body>
</html>
